packages:
  - docs
  - packages/*

# Supply-chain cooldown: don't install package versions published less than a day
# ago (mitigates a compromised-release window). Trusted publishers are excluded so
# our own/closely-tracked packages still update immediately.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@kitql/*'
  - kitql-lint
  - vite-plugin-kit-routes
  - vite-plugin-stripper
  - vite-plugin-watch-and-run
  - remult

catalogs:
  docs:
    '@astrojs/starlight': 0.41.3
    accessible-astro-components: 5.8.0
    astro: 7.3.3
    astro-icon: 1.2.0
    sharp: 0.35.3
    prettier-plugin-astro: 0.14.1

  best:
    remult: 3.3.18

  tooling:
    '@typescript/native-preview': 7.0.0-dev.20260112.1
    vite: 7.3.1
    '@tsconfig/svelte': 5.0.2
    tslib: 2.8.0
    vite-plugin-watch-and-run: 1.8.3
    prettier: 3.9.6

  kitql:
    '@kitql/eslint-config': 0.9.2
    eslint: 10.12.0

  testing:
    '@playwright/test': 1.63.0
    '@vitest/browser': 3.2.3
    playwright: 1.63.0
    vitest: 3.2.3

  lib-author-helper:
    '@changesets/changelog-github': 1.0.1
    '@changesets/cli': 3.0.3

  svelte:
    'svelte': 5.40.0
    svelte-check: 4.7.3
    svelte-micro: 2.5.7

  sveltekit:
    '@sveltejs/adapter-node': 5.5.4
    '@sveltejs/kit': 2.46.5
    '@sveltejs/vite-plugin-svelte': 6.2.1
    '@sveltejs/package': 3.0.0

  ui:
    tailwindcss: 4.3.0
    '@tailwindcss/vite': 4.3.0

  # firstly's dependencies: ranges, not pins (published as-is), so apps can share one copy.
  lib-dep-publish:
    '@kitql/helpers': ^0.8.15
    '@layerstack/utils': ^1.0.0
    '@mdi/js': ^7.4.47
    '@types/nodemailer': ^8.0.0
    clsx: ^2.1.1
    cron: ^4.4.0
    esm-env: ^1.2.2
    nodemailer: ^10.0.10
    svelte-sonner: ^1.2.1
    tailwind-merge: ^3.7.0
    vite-plugin-kit-routes: ^1.1.1
    vite-plugin-stripper: ^0.10.6

allowBuilds:
  esbuild: true
